name: IndieAppGrowthKitDemo
options:
  bundleIdPrefix: com.indieappgrowthkit.demo
  deploymentTarget:
    iOS: "18.0"

packages:
  IndieAppGrowthKit:
    path: ..

targets:
  IndieAppGrowthKitDemo:
    type: application
    platform: iOS
    sources:
      - path: IndieAppGrowthKitDemo
    dependencies:
      - package: IndieAppGrowthKit
        product: IndieAppGrowthKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indieappgrowthkit.demo
        PRODUCT_NAME: IndieAppGrowthKitDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: IndieAppGrowthKit Demo
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
      storeKitConfiguration: Demo.storekit
